version: 2
updates:
  # Reads gradle/libs.versions.toml. Compose Multiplatform-paired libraries (compose-*, *-mp)
  # should be bumped together with compose-multiplatform — check its release notes.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
          - "com.android.*"
    ignore:
      # Material 3 (incl. adaptive) is versioned in lockstep with Compose Multiplatform: each CMP
      # release pairs specific versions. Patch/alpha bumps within the paired line are fine, but
      # minor/major jumps belong to a CMP upgrade — do those by hand from the CMP release notes.
      - dependency-name: "org.jetbrains.compose.material3*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
