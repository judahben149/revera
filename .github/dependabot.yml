version: 2
updates:
  # Reads gradle/libs.versions.toml. Compose Multiplatform-paired libraries (compose-*, *-mp)
  # should be bumped together with compose-multiplatform — check its release notes.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
          - "com.android.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
