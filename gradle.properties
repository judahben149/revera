# --- Gradle -----------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true

# --- Kotlin -----------------------------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# Lets Linux/Windows machines build Android, desktop and web without Xcode (iOS targets are skipped).
kotlin.native.ignoreDisabledTargets=true

# --- Android ----------------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Revera -----------------------------------------------------------------------------------
# App version shared by Android, desktop and the generated BuildConfig.
# (iOS reads MARKETING_VERSION / CURRENT_PROJECT_VERSION from apps/ios/Configuration/Config.xcconfig.)
# Desktop packaging requires MAJOR > 0.
revera.versionName=1.0.0
revera.versionCode=1
# dev | staging | prod — surfaced to code as BuildConfig.ENVIRONMENT.
revera.environment=dev
# Set to true (e.g. in CI) to fail the build on Kotlin warnings.
revera.warningsAsErrors=false
# Set to true to emit Compose compiler stability reports/metrics into build/compose-*.
revera.composeCompilerReports=false
# Root URL of Revera's backend API. The shared Ktor client resolves relative requests against it
# (BuildConfig.API_BASE_URL), e.g. client.get("v1/topics"). Empty until a backend exists; override
# per environment with -Prevera.apiBaseUrl=https://… (or set it here for the default/dev backend).
revera.apiBaseUrl=
